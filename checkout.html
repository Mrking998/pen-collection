<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3E9D3">
<title>Checkout — Pen Collection</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/backend.css">
</head>
<body class="has-sticky-cta">
<a href="#main" class="skip-link">Skip to content</a>

<header class="site-nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="brand-mark"><img src="assets/logo-mark.png" alt="" class="logo-icon">Pen Collection</a>
    <nav class="links" aria-label="Primary">
      <a href="about.html">About</a>
      <a href="index.html#collection">Collection</a>
      <a href="index.html#visit">Visit</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="wrap" style="padding-top:60px; padding-bottom:80px; max-width:640px;">
    <p class="eyebrow">Checkout</p>
    <h1 class="display" style="font-size:clamp(28px,4vw,42px); margin:10px 0 30px;">Your Bag</h1>

    <div id="checkout-summary" class="checkout-summary"></div>

    <form id="checkout-form" class="admin-form" style="margin-top:30px; max-width:100%;">
      <label for="co-name">Full name</label>
      <input type="text" id="co-name" required>
      <label for="co-email">Email</label>
      <input type="email" id="co-email" required>
      <label for="co-phone">Phone</label>
      <input type="tel" id="co-phone" placeholder="080X XXX XXXX" required>
      <button type="submit" class="btn btn-gold" style="margin-top:16px;">Pay With Paystack</button>
      <p id="checkout-status" class="form-status" role="status"></p>
      <p class="form-note">By checking out you agree to our <a href="terms-of-service.html">Terms of Service</a>. Collection is in-store — we'll confirm your pickup shop via WhatsApp.</p>
    </form>
  </section>
</main>

<footer>
  <div class="wrap footer-inner">
    <span>© <span data-year></span> Pen Collection Nig. LTD.</span>
    <nav aria-label="Footer">
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms-of-service.html">Terms</a>
      <a href="index.html">Home</a>
    </nav>
  </div>
</footer>

<script src="assets/site.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/checkout.js"></script>
</body>
</html>
